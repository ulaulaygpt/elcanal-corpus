name: Enrich corpus from Zenodo

on:
  push:
    branches: [main]
    paths:
      - "corpus-index.yml"
      - ".github/workflows/enrich-from-zenodo.yml"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch public Zenodo metadata for every corpus DOI
        shell: python
        run: |
          from pathlib import Path
          import json, re, time, urllib.request

          src = Path("corpus-index.yml").read_text(encoding="utf-8")
          dois = re.findall(r'^\s+doi:\s+"10\.5281/zenodo\.(\d+)"\s*$', src, re.M)
          if len(dois) != 62 or len(set(dois)) != 62:
              raise SystemExit(f"Expected 62 unique Zenodo record ids, got {len(dois)} / {len(set(dois))}")

          out = []
          for i, rid in enumerate(dois, 1):
              url = f"https://zenodo.org/api/records/{rid}"
              req = urllib.request.Request(url, headers={"User-Agent":"elcanal-corpus-registry/1.0"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.load(resp)

              md = data.get("metadata", {})
              creators = []
              for c in md.get("creators", []) or []:
                  creators.append({
                      "name": c.get("name"),
                      "orcid": c.get("orcid"),
                      "affiliation": c.get("affiliation"),
                  })

              rtype = md.get("resource_type") or {}
              license_obj = md.get("license") or {}
              record = {
                  "record_id": str(data.get("id", rid)),
                  "doi": md.get("doi") or data.get("doi"),
                  "conceptdoi": md.get("conceptdoi") or data.get("conceptdoi"),
                  "title": md.get("title"),
                  "publication_date": md.get("publication_date"),
                  "version": md.get("version"),
                  "resource_type": rtype.get("type") or rtype.get("title") or rtype.get("id"),
                  "resource_subtype": rtype.get("subtype"),
                  "license": license_obj.get("id") or license_obj.get("title"),
                  "language": md.get("language"),
                  "creators": creators,
                  "keywords": md.get("keywords") or [],
                  "related_identifiers": md.get("related_identifiers") or [],
                  "zenodo_url": f"https://zenodo.org/records/{rid}",
              }
              out.append(record)
              print(f"[{i:02d}/62] {record['doi']} — {record['title']}")
              time.sleep(0.15)

          Path("metadata").mkdir(exist_ok=True)
          Path("metadata/zenodo-records.json").write_text(
              json.dumps({
                  "schema_version": 1,
                  "source": "Zenodo public REST API",
                  "generated_from": "corpus-index.yml",
                  "record_count": len(out),
                  "records": out
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

      - name: Validate enrichment
        shell: python
        run: |
          from pathlib import Path
          import json
          d=json.loads(Path("metadata/zenodo-records.json").read_text(encoding="utf-8"))
          rs=d["records"]
          if len(rs)!=62:
              raise SystemExit(f"Expected 62 metadata records, got {len(rs)}")
          dois=[x.get("doi") for x in rs]
          if len(set(dois))!=62:
              raise SystemExit("Duplicate or missing DOI in enriched metadata")
          missing=[x["record_id"] for x in rs if not x.get("title") or not x.get("publication_date")]
          if missing:
              raise SystemExit("Missing basic metadata for record ids: "+", ".join(missing))
          print("PASS: 62 unique Zenodo records enriched.")

      - name: Commit enriched metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/zenodo-records.json
          if git diff --cached --quiet; then
            echo "No metadata changes."
            exit 0
          fi
          git commit -m "Enrich public corpus registry from Zenodo metadata"
          git push
